---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-design-data-pvc
  namespace: {{ .Values.namespace.name }}
  labels:
    app: open-design
spec:
  storageClassName: {{ .Values.opendesign.persistence.data.storageClassName }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.opendesign.persistence.data.size }}
---
# Persist /home/opendesign — keeps claude.ai login, opencode config, etc.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-design-home-pvc
  namespace: {{ .Values.namespace.name }}
  labels:
    app: open-design
spec:
  storageClassName: {{ .Values.opendesign.persistence.home.storageClassName }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.opendesign.persistence.home.size }}
{{- if .Values.mcp.enabled }}
---
# OD MCP Server — PVC for config persistence
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: od-mcp-data
  namespace: {{ .Values.namespace.name }}
  labels:
    app: od-mcp
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.mcp.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.mcp.persistence.size }}
{{- end }}
