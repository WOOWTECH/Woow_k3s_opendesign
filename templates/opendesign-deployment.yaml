---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-design
  namespace: {{ .Values.namespace.name }}
  labels:
    app: open-design
    app.kubernetes.io/component: daemon
    app.kubernetes.io/part-of: open-design
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-design
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: open-design
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.opendesign.nodeHostname | quote }}
      securityContext:
        fsGroup: 1001
      terminationGracePeriodSeconds: 30
      containers:
        - name: open-design
          image: "{{ .Values.opendesign.image.repository }}:{{ .Values.opendesign.image.tag }}"
          imagePullPolicy: {{ .Values.opendesign.image.pullPolicy }}
          ports:
            - containerPort: 7457
              name: http
          envFrom:
            - configMapRef:
                name: od-config
          volumeMounts:
            - name: od-data
              mountPath: /app/.od
            - name: od-home
              mountPath: /home/opendesign
          resources:
            {{- toYaml .Values.opendesign.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: 7457
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/health
              port: 7457
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: od-data
          persistentVolumeClaim:
            claimName: open-design-data-pvc
        - name: od-home
          persistentVolumeClaim:
            claimName: open-design-home-pvc
