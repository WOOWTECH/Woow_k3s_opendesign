{{- if .Values.networkPolicy.enabled }}
---
# NetworkPolicy: Allow ingress from cloudflare tunnel and internal traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: open-design-policy
  namespace: {{ .Values.namespace.name }}
spec:
  podSelector:
    matchLabels:
      app: open-design
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 7457
    - from:
        - podSelector: {}
      ports:
        - port: 7457
{{- if .Values.console.enabled }}
---
# NetworkPolicy: Allow ingress to console (dashboard + ttyd)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: od-console-policy
  namespace: {{ .Values.namespace.name }}
spec:
  podSelector:
    matchLabels:
      app: od-console
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 18790
        - port: 7681
    - from:
        - podSelector: {}
      ports:
        - port: 18790
        - port: 7681
{{- end }}
{{- if .Values.mcp.enabled }}
---
# NetworkPolicy: Allow ingress to MCP server (admin + streamableHttp)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: od-mcp-policy
  namespace: {{ .Values.namespace.name }}
spec:
  podSelector:
    matchLabels:
      app: od-mcp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 8080
        - port: 8000
    - from:
        - podSelector: {}
      ports:
        - port: 8080
        - port: 8000
{{- end }}
{{- end }}
