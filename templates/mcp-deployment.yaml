{{- if .Values.mcp.enabled }}
---
# OD MCP Server — Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: od-mcp
  namespace: {{ .Values.namespace.name }}
  labels:
    app: od-mcp
    app.kubernetes.io/part-of: open-design
spec:
  replicas: 1
  selector:
    matchLabels:
      app: od-mcp
  template:
    metadata:
      labels:
        app: od-mcp
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.mcp.nodeHostname }}
      containers:
        - name: od-mcp
          image: "{{ .Values.mcp.image.repository }}:{{ .Values.mcp.image.tag }}"
          imagePullPolicy: {{ .Values.mcp.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: admin
            - containerPort: 8000
              name: mcp
          env:
            - name: OD_API_BASE
              value: {{ .Values.mcp.env.OD_API_BASE | quote }}
            - name: MCP_SERVER_PORT
              value: {{ .Values.mcp.env.MCP_SERVER_PORT | quote }}
            - name: ADMIN_PORT
              value: {{ .Values.mcp.env.ADMIN_PORT | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: od-mcp-secrets
                  key: JWT_SECRET
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: od-mcp-secrets
                  key: ADMIN_PASSWORD
            - name: CONFIG_DIR
              value: {{ .Values.mcp.env.CONFIG_DIR | quote }}
            - name: NAMESPACE
              value: {{ .Values.namespace.name | quote }}
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: od-mcp-data
{{- end }}
