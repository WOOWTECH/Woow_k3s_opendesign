{{- if .Values.mcp.enabled }}
---
# OD MCP Server — Service
apiVersion: v1
kind: Service
metadata:
  name: od-mcp-svc
  namespace: {{ .Values.namespace.name }}
  labels:
    app: od-mcp
    app.kubernetes.io/part-of: open-design
spec:
  type: {{ .Values.mcp.service.type }}
  selector:
    app: od-mcp
  ports:
    - name: admin
      port: {{ .Values.mcp.service.adminPort }}
      targetPort: 8080
      {{- if and (eq .Values.mcp.service.type "NodePort") .Values.mcp.service.adminNodePort }}
      nodePort: {{ .Values.mcp.service.adminNodePort }}
      {{- end }}
    - name: mcp
      port: {{ .Values.mcp.service.mcpPort }}
      targetPort: 8000
      {{- if and (eq .Values.mcp.service.type "NodePort") .Values.mcp.service.mcpNodePort }}
      nodePort: {{ .Values.mcp.service.mcpNodePort }}
      {{- end }}
{{- end }}
