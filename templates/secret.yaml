---
# Secrets for open-design daemon
# IMPORTANT: Replace placeholder values before deploying!
#   OD_API_TOKEN:     openssl rand -hex 32
#   ANTHROPIC_API_KEY: your Anthropic API key
#   TUI_PASSWORD:     ttyd basic-auth password for the od-console terminal
apiVersion: v1
kind: Secret
metadata:
  name: od-secrets
  namespace: {{ .Values.namespace.name }}
  labels:
    app: open-design
    app.kubernetes.io/part-of: open-design
type: Opaque
stringData:
  OD_API_TOKEN: {{ .Values.secrets.odApiToken | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  TUI_PASSWORD: {{ .Values.secrets.tuiPassword | quote }}
{{- if .Values.mcp.enabled }}
---
# OD MCP Server — Secret for JWT auth
apiVersion: v1
kind: Secret
metadata:
  name: od-mcp-secrets
  namespace: {{ .Values.namespace.name }}
  labels:
    app: od-mcp
    app.kubernetes.io/part-of: open-design
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.mcpJwtSecret | quote }}
  ADMIN_PASSWORD: {{ .Values.secrets.mcpAdminPassword | quote }}
{{- end }}
