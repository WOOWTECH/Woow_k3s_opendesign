# Example values for the OPT-IN extra-env Secret. Copy, fill in, and keep the
# copy OUT OF GIT -- .gitignore already covers *-secret-values.yaml and
# /values.local.yaml at the repository root.
#
# Nothing in this file is real. Every value below is an obvious example string.
#
# ── Which mode do you want? ────────────────────────────────────────────────
#
# A) The Secret already exists (RECOMMENDED, and the chart default). Create it
#    however this namespace already creates Secrets, for example:
#
#      kubectl --context woow-k3s -n pi-agent-woow create secret generic \
#        opendesign-extra-env \
#        --from-literal=OPENROUTER_API_KEY=<the real key>
#
#    then reference it. The chart renders NO Secret in this mode and the value
#    never passes through Helm:
#
#      opendesign:
#        extraEnvSecret:
#          enabled: true
#          create: false
#          name: opendesign-extra-env     # optional; this is also the default
#
# B) Let the chart render it from these values. Use this only when the values
#    file is never committed: anything given to `helm install` is also stored in
#    the release Secret, base64-encoded but NOT encrypted.

opendesign:
  extraEnvSecret:
    enabled: true
    create: true
    # Empty means <release>-extra-env.
    name: ""
    # false: the pod refuses to start if the Secret is missing, rather than
    # starting with the variable silently unset.
    optional: false
    data:
      # Keys the live deployment uses today. One entry per variable; every
      # value is required(), so an empty one is a render failure.
      #
      # OpenRouter server-side key used by the in-container OpenCode runtime.
      # This is the key the live release currently passes through
      # opendesign.extraEnv, i.e. into a cleartext ConfigMap. Moving it here is
      # the whole point of this file.
      OPENROUTER_API_KEY: sk-or-v1-EXAMPLE-NOT-A-REAL-KEY

      # Any further reviewed variable goes here too. Chart-owned keys
      # (OD_BIND_HOST, OD_PORT, OD_DATA_DIR, OD_ALLOWED_ORIGINS,
      # OD_PUBLIC_BASE_URL, HOME, the Playwright pair) are rejected at render
      # time, in this map as well as in extraEnv.

# Reminder: BYOK provider keys entered in the OpenDesign UI stay in the
# browser. They never need a Secret, a ConfigMap or an env var. Only a
# server-side key used by the container runtime belongs here.
