# RBAC for open-design console — allows exec into open-design pod
apiVersion: v1
kind: ServiceAccount
metadata:
  name: od-console-sa
  namespace: open-design
  labels:
    app: od-console
    app.kubernetes.io/part-of: open-design
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: od-console-role
  namespace: open-design
rules:
  # Find pods
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Exec into pods (critical for ttyd terminal)
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  # Read pod logs
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Restart deployment
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["open-design"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
  # Manage secrets (for API key updates)
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["od-secrets"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: od-console-binding
  namespace: open-design
subjects:
  - kind: ServiceAccount
    name: od-console-sa
    namespace: open-design
roleRef:
  kind: Role
  name: od-console-role
  apiGroup: rbac.authorization.k8s.io
