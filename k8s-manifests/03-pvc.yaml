apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-design-data-pvc
  namespace: open-design
  labels:
    app: open-design
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
---
# Persist /home/opendesign — keeps claude.ai login, opencode config, etc.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-design-home-pvc
  namespace: open-design
  labels:
    app: open-design
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
