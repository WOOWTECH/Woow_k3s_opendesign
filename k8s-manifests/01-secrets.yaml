# Secrets for open-design daemon
# IMPORTANT: Replace placeholder values before deploying!
#   OD_API_TOKEN: openssl rand -hex 32
#   ANTHROPIC_API_KEY: your Anthropic API key
apiVersion: v1
kind: Secret
metadata:
  name: od-secrets
  namespace: open-design
  labels:
    app: open-design
    app.kubernetes.io/part-of: open-design
type: Opaque
stringData:
  OD_API_TOKEN: "PLACEHOLDER_RUN_openssl_rand_hex_32"
  ANTHROPIC_API_KEY: "PLACEHOLDER_WILL_BE_PROVIDED"
