# Default values for the opendesign chart.
# Defaults reproduce the original Kustomize deployment 1:1
# (namespace open-design, ClusterIP services, local-path storage,
# imagePullPolicy=Never for the local-built od + od-mcp images).

namespace:
  # Create the target namespace as part of the release.
  # Set to false if the namespace is managed elsewhere.
  create: true
  # Original Kustomize namespace is "open-design".
  name: open-design

# ── open-design daemon ─────────────────────────────────────────────
opendesign:
  image:
    # Local build (see Dockerfile.open-design). Kept private to the K3s node
    # via imagePullPolicy=Never.
    repository: localhost/open-design
    tag: latest
    pullPolicy: Never

  # kubernetes.io/hostname node selector. The original Kustomize manifests
  # used the placeholder "__K3S_NODE_HOSTNAME__" and deploy.sh sed-replaced
  # it. Override on install:
  #   --set opendesign.nodeHostname=woowtechcluster1-aorus-15p-xd
  nodeHostname: "__K3S_NODE_HOSTNAME__"

  # Exposed to the container via a ConfigMap (envFrom).
  config:
    # Deploy-time domain (replace __DOMAIN__ or override via --set)
    OD_ALLOWED_ORIGINS: "https://__DOMAIN__"
    # Public-facing URL for MCP OAuth callback; must use HTTPS to match the
    # Cloudflare tunnel. Without this the OAuth redirect_uri is registered
    # as http:// (from internal request headers) while the browser
    # redirects via https://, causing "invalid_request" from auth providers.
    OD_PUBLIC_BASE_URL: "https://__DOMAIN__"
    OD_PORT: "7457"
    OD_BIND_HOST: "0.0.0.0"
    # Auth handled by Cloudflare Tunnel — disable daemon-level API auth.
    OD_DISABLE_API_AUTH: "1"

  service:
    # Original manifests use ClusterIP; set to NodePort (and set nodePort)
    # to expose the daemon directly on a node port.
    type: ClusterIP
    port: 7457
    # Only rendered when type is NodePort.
    nodePort: ""

  persistence:
    data:
      # /app/.od (od-runner working data)
      storageClassName: local-path
      size: 8Gi
    home:
      # /home/opendesign — keeps claude.ai login, opencode config, etc.
      storageClassName: local-path
      size: 2Gi

  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi

# ── od-console (web dashboard + ttyd terminal) ─────────────────────
console:
  # Deploy the console web dashboard + ttyd terminal.
  enabled: true

  image:
    repository: python:3.9-slim
    tag: ""     # blank = use the tag baked into image.repository
    pullPolicy: IfNotPresent

  service:
    # Original manifests use ClusterIP.
    type: ClusterIP
    httpPort: 18790
    ttydPort: 7681
    httpNodePort: ""
    ttydNodePort: ""

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ── od-mcp (MCP server for Open-Design) ────────────────────────────
mcp:
  # Deploy the OD MCP server sidecar (admin + streamableHttp).
  enabled: true

  image:
    repository: localhost/od-mcp
    tag: latest
    pullPolicy: Never

  # Original manifests pin od-mcp to a specific node.
  nodeHostname: "woowtechcluster1-aorus-15p-xd"

  # Exposed via env vars on the deployment (not a ConfigMap).
  env:
    OD_API_BASE: "http://open-design-svc:7457"
    MCP_SERVER_PORT: "8000"
    ADMIN_PORT: "8080"
    CONFIG_DIR: "/data"

  service:
    type: ClusterIP
    adminPort: 8080
    mcpPort: 8000
    adminNodePort: ""
    mcpNodePort: ""

  persistence:
    # /data (MCP config persistence)
    storageClassName: local-path
    size: 100Mi

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 3Gi

# ── Ingress lockdown (NetworkPolicies) ─────────────────────────────
networkPolicy:
  # Original manifests always ship NetworkPolicies for daemon / console /
  # mcp. Disable if your cluster doesn't run a NetworkPolicy controller.
  enabled: true

# ── Secrets ────────────────────────────────────────────────────────
# Change every "changeme"/"PLACEHOLDER" value before a real deployment.
secrets:
  # -- OD daemon API token. Generate with: openssl rand -hex 32
  odApiToken: "PLACEHOLDER_RUN_openssl_rand_hex_32"
  # -- Anthropic API key used by the OD daemon (Claude access)
  anthropicApiKey: "PLACEHOLDER_WILL_BE_PROVIDED"
  # -- ttyd basic-auth password for the od-console terminal (admin:<pw>).
  #    NOTE: The original 01-secrets.yaml manifest is missing this key but
  #    the od-console Deployment declares it as a required envFrom
  #    secretKeyRef, which prevents the console pod from starting. This
  #    chart adds it with a "changeme" default (same style as other Woow
  #    secrets) so the console is deployable out of the box. Override
  #    before any real deployment.
  tuiPassword: "changeme-ttyd-admin-password"

  # -- od-mcp JWT secret. Generate with: openssl rand -hex 32
  mcpJwtSecret: "20b2769b76ad6f1217d8759ac56ae0536a2baa3f38c8751b7153746021a06a09"
  # -- od-mcp admin dashboard password
  mcpAdminPassword: "admin"
