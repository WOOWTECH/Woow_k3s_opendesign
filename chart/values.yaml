# Woow OpenDesign on woow-k3s.
#
# Installed into an EXISTING namespace (Rancher owns namespace creation here):
#   helm -n pi-agent-woow install opendesign . -f my-values.yaml
#
# This chart creates NO namespace, NO Secret, NO ServiceAccount and NO RBAC.
# It holds no credential of any kind: OpenDesign's BYOK keys are entered in the
# browser and stay browser-local, the daemon binds to loopback so it needs no
# API token, and authentication is done by the shared Nginx Proxy Manager
# container (deployment/npm in this namespace), never by this chart.

nameOverride: ""
fullnameOverride: ""

# ── Data retention ─────────────────────────────────────────────────────────
# true adds `helm.sh/resource-policy: keep` to every object that holds state:
# both PVCs, and the extra-env Secret when this chart creates it.
# `helm uninstall` then leaves the data behind -- the only reason the previous
# deployment's ~204 MiB of tenant data survived at all. The chart renders no
# Namespace (pi-agent-woow is Rancher-managed and shared), so there is nothing
# namespace-shaped to keep.
#
# Set it false ONLY for a throwaway test release whose volumes should go with
# it, and expect `helm uninstall` to take the data with them.
keepOnUninstall: true

# ── Required ───────────────────────────────────────────────────────────────
# The public origin this instance is reached on THROUGH Nginx Proxy Manager,
# e.g. https://od-woow-k3s.woowtech.io
#
# Drives OD_ALLOWED_ORIGINS and OD_PUBLIC_BASE_URL. EVERY install must set it.
#
# The value below is an example domain, never a real one, and it is chosen so
# that the shipped defaults render and validate: `helm template ./chart`,
# `helm lint`, kubeconform and chart-testing all exercise the default path.
# Leaving it in place fails CLOSED rather than open -- OD_ALLOWED_ORIGINS is
# then an origin no browser can ever present, so OpenDesign rejects every
# cross-site request instead of trusting them all, which is what an EMPTY
# value used to do.
#
# The guards are still hard render failures:
#   * an empty string                              -> "publicUrl is required"
#   * anything but an https:// origin with no path -> "publicUrl must be ..."
# and NOTES.txt prints a loud warning while this example value is still in
# effect. Unlike the old chart's `__K3S_NODE_HOSTNAME__`, nothing unusable can
# reach the API server.
publicUrl: "https://opendesign.example.com"

# ── OpenDesign image ───────────────────────────────────────────────────────
image:
  repository: ghcr.io/woowtech/woow-k3s-opendesign
  # Blank = use .Chart.Version (2.0.1). The literal "latest" is rejected.
  tag: ""
  # sha256:... -- when set it WINS over tag and the image is pulled by digest.
  # The release job PRINTS the published digest in its GitHub step summary; it
  # does not write it back here, so pinning it is a manual step -- either in
  # this file at release time, or per release in its instance values, as
  # deploy/woow-k3s/opendesign.yaml does.
  digest: ""
  pullPolicy: IfNotPresent

# The package is published public, as ghcr.io/woowtech/woow-k3s-pi-agent is
# (the live pi-agent Deployments pull it with no pull secret), so nothing here
# is required. The live `opendesign` release nevertheless sets
# imagePullSecrets: [ghcr-woowtech]; it is harmless, and removing it would
# rewrite a running pod template for no gain.
imagePullSecrets: []

# ── nginx sidecar ──────────────────────────────────────────────────────────
# Terminates the pod-network connection so the OpenDesign daemon can stay on
# 127.0.0.1. It does NO authentication and NO path rewriting -- see
# files/nginx.conf for the full list of things it must never grow.
nginx:
  image:
    repository: nginx
    tag: "1.27-alpine"
    pullPolicy: IfNotPresent
  # The only port reachable over the pod network.
  port: 7457
  # Reject mutating requests (anything but GET/HEAD/OPTIONS) that carry no
  # Origin header. Keep this true: it closes the one gap left by normalising
  # Host to the loopback form OpenDesign trusts unconditionally. Set it false
  # only for non-browser automation that cannot send an Origin, and record why.
  requireOriginOnMutation: true
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ── OpenDesign daemon ──────────────────────────────────────────────────────
opendesign:
  # Loopback only. NOT a Service port and NOT a containerPort.
  port: 7456
  dataDir: /data/opendesign
  timezone: Asia/Taipei

  # Extra env for the OpenDesign container, for reviewed additions such as
  # OD_ALLOWED_INTERNAL_HOSTS. OD_BIND_HOST, OD_PORT, OD_DATA_DIR,
  # OD_ALLOWED_ORIGINS and OD_PUBLIC_BASE_URL are chart-owned and are rejected
  # here; so are the API-token and disabled-auth switches, which this
  # deployment does not need and must never set.
  #
  # THIS MAP IS RENDERED INTO THE -config ConfigMap IN CLEARTEXT. Anything with
  # get on ConfigMaps in the namespace can read it, and `helm get values` echoes
  # it back. Nothing that behaves like a credential belongs here -- that is what
  # extraEnvSecret below is for.
  extraEnv: {}

  # Render-time guard: fail when a key in extraEnv looks like a credential
  # (anything ending in _API_KEY, _TOKEN, _SECRET, _PASSWORD).
  #
  # Ships false, deliberately. The live `opendesign` release passes an
  # OpenRouter key through extraEnv today, and flipping this on by default
  # would make its own values un-renderable. Flip it to true in the instance
  # values once that key has moved to extraEnvSecret.
  rejectSecretShapedExtraEnv: false

  # Extra env taken from a Secret instead of the ConfigMap. envFrom keeps the
  # values out of the ConfigMap, out of the pod spec and out of
  # `helm get values`; only the Secret NAME is ever rendered.
  #
  # Every default here is off, so the rendered Deployment is byte-identical to
  # a release installed before this key existed.
  extraEnvSecret:
    # true appends envFrom.secretRef to the OpenDesign container. That CHANGES
    # THE POD TEMPLATE, so turning it on rolls the pod once.
    enabled: false
    # Name of the Secret. Empty means <fullname>-extra-env.
    name: ""
    # true tolerates the Secret being absent at pod start (the kubelet skips
    # it). Keep false: a silently missing variable is worse than a pod that
    # refuses to start.
    optional: false
    # false (the default) means the Secret already exists and is managed OUT OF
    # BAND -- `kubectl create secret generic`, or whatever the namespace
    # already uses. The chart only references it by name.
    #
    # true renders the Secret from `data` below, with required() on every
    # value, so an empty one is a render failure rather than an empty variable.
    # Use it only where the values file itself is never committed: values
    # passed to `helm install` also land in the release Secret, base64-encoded
    # but not encrypted. See examples/secrets.example.yaml.
    create: false
    # KEY: value pairs, read only when create: true.
    data: {}

  # Sized for one headless Chromium render at a time (the renderer holds a
  # Semaphore(1)) with MAX_PIXELS 48,000,000 -- a 48 MP RGBA bitmap alone is
  # ~183 MiB before Chromium's own overhead -- and MAX_OUTPUT_BYTES 128 MiB
  # buffered per export. The request is what the pod actually needs while idle
  # and serving the UI; the limit is the live release's proven ceiling.
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 8Gi

# ── Service ────────────────────────────────────────────────────────────────
service:
  # ClusterIP only. `type` is deliberately NOT configurable: NodePort or
  # LoadBalancer would publish OpenDesign past Nginx Proxy Manager, which is
  # the whole authentication boundary. values.schema.json rejects a `type` key.
  port: 7457
  annotations: {}

# ── Storage ────────────────────────────────────────────────────────────────
# NOTE: this cluster has TWO StorageClasses annotated is-default-class=true
# (local-path and longhorn), so an omitted storageClassName is resolved by an
# ambiguous tiebreak. Every PVC here names its class explicitly.
persistence:
  data:
    # `longhorn` is reclaimPolicy Retain and allowVolumeExpansion true.
    # Never longhorn-delete (Delete) or local-path (Delete, single node, no
    # expansion) -- that is the posture that left the previous deployment's
    # ~204 MiB of tenant data one `helm uninstall` from gone.
    storageClassName: longhorn
    size: 20Gi
    accessModes:
      - ReadWriteOnce
    # Extra annotations only. `helm.sh/resource-policy: keep` comes from the
    # top-level keepOnUninstall and must not be repeated here.
    annotations: {}

# ── Backup ─────────────────────────────────────────────────────────────────
# Longhorn has no working backup target on this cluster
# (backuptargets/default reports available: false, zero recurringjobs), so the
# chart ships its own tar-to-a-second-PVC CronJob rather than delegating.
# This survives a bad `helm uninstall` or an accidental PVC delete. It does
# NOT survive loss of the cluster -- for off-site durability configure a
# Longhorn backup target or add an upload step.
backup:
  enabled: true
  # 03:17 daily. CronJob schedules are evaluated in the cluster's timezone.
  schedule: "17 3 * * *"
  # Archives to keep on the backup PVC.
  retain: 7
  persistence:
    storageClassName: longhorn
    size: 20Gi
    accessModes:
      - ReadWriteOnce
    annotations: {}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ── NetworkPolicy ──────────────────────────────────────────────────────────
# Modelled byte-for-byte on the five live pi-agent policies so the fleet stays
# uniform. Port 7456 is deliberately absent: the daemon is bound to 127.0.0.1
# and is not reachable over the pod network at all, so no rule can name it.
# Kubelet probes are exempt from NetworkPolicy and hit the sidecar directly.
networkPolicy:
  enabled: true
  # Pods allowed to reach the nginx sidecar. Same namespace, so this is a bare
  # podSelector -- no namespaceSelector, no label to add elsewhere.
  fromPodLabels:
    app: npm
  # Extra CIDRs allowed in (LAN admin/debug), matching the pi-agent fleet.
  fromCIDRs:
    - 192.168.0.0/16
  # Add one more ingress peer -- sidecar port only -- selecting the `helm test`
  # hook pod (component=helm-test, this release). Without it the hook cannot
  # reach the Service while this policy is in force and `helm test` times out.
  #
  # Ships false so the rendered NetworkPolicy stays byte-identical to the live
  # release's. Turning it on rewrites ONE NetworkPolicy and rolls nothing.
  allowHelmTest: false
  # Egress: DNS to kube-dns, then everything EXCEPT the pod CIDR, the service
  # CIDR, the LAN and the metadata IP.
  egressExcept:
    - 10.42.0.0/16
    - 10.43.0.0/16
    - 192.168.0.0/16
    - 169.254.169.254/32

# ── Probes ─────────────────────────────────────────────────────────────────
# All three run against http://:7457/api/health on the nginx sidecar, which is
# the only port on the pod network. OpenDesign's origin middleware exempts
# health/version for monitoring probes, and a 200 there proves the whole chain
# nginx -> 127.0.0.1:7456 -> daemon is up.
# startup is generous: Chromium plus OpenDesign cold-starting on a freshly
# attached Longhorn volume is slow (60 x 10s = 10 minutes of grace).
probes:
  startup:
    periodSeconds: 10
    failureThreshold: 60
    timeoutSeconds: 5
  readiness:
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5
  liveness:
    periodSeconds: 30
    failureThreshold: 5
    timeoutSeconds: 10

# ── helm test ──────────────────────────────────────────────────────────────
# A read-only smoke hook: one short-lived pod that GETs /api/health and
# /api/version through the Service, over exactly the path Nginx Proxy Manager
# uses. It writes nothing, mounts no PVC, and reuses the already-pinned
# OpenDesign image, so no extra image has to be pulled or trusted.
#
# It deliberately does NOT carry the chart's selector labels: a pod that did
# would join the Service EndpointSlice and black-hole a share of live requests
# for as long as it ran.
#
# With networkPolicy.enabled: true it also needs networkPolicy.allowHelmTest.
helmTest:
  enabled: true
  # Attempts per GET, two seconds apart. The hook pod is created seconds before
  # it runs and the NetworkPolicy admitting it is enforced from an ipset keyed on
  # its IP, which the policy controller has to learn first; connecting too early
  # is REJECTED and looks exactly like a broken Service. One attempt made
  # back-to-back `helm test` runs fail about half the time.
  retries: 15
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ── Scheduling / misc ──────────────────────────────────────────────────────
podAnnotations: {}
podLabels: {}
# Intentionally empty. Longhorn is distributed with dataLocality disabled;
# `strategy: Recreate` is what handles the RWO single-attach constraint, not
# node pinning. The old chart's `__K3S_NODE_HOSTNAME__` placeholder here is
# exactly what made it uninstallable.
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
terminationGracePeriodSeconds: 60
