# nginx sidecar for Woow OpenDesign on k3s.
#
# Its ONLY job is to terminate the pod-network connection so the OpenDesign
# daemon can stay bound to 127.0.0.1, and to normalise Host to the loopback
# form the daemon trusts unconditionally.
#
# THINGS THIS FILE MUST NEVER GROW -- each was considered and rejected:
#   * NO HTTP basic authentication of any kind here -- no htpasswd file,
#     no bearer check, no credential lookup.
#     Authentication is Nginx Proxy Manager's job, exclusively. A second
#     auth surface here would be a second place to get it wrong.
#   * NO path-prefix rewriting. No ingress-prefix map, no ingress-path
#     request header, none of the Home Assistant add-on's ~12 URL body
#     rewrites, no client-side URL shim. Behind NPM the app is mounted at /
#     on its own vhost; there is no prefix, and rewriting with an empty one
#     is pure regression surface over every network call in the SPA.
#   * NEVER blank the Origin request header. The HA add-on has to, because
#     the HA Ingress origin is unpredictable. Here the origin is a fixed
#     vhost, so passing Origin through unchanged keeps OpenDesign's genuine
#     cross-site rejection working against OD_ALLOWED_ORIGINS.
#   * NO separate export location. With one <head>-anchored sub_filter and
#     sub_filter_types limited to CSS/JS, binary export responses are already
#     untouched; a second location block would only drift.
#
# nginx:1.27-alpine's own entrypoint runs `nginx -g "daemon off;"`, so no
# `daemon off;` here.

# Everything writable lives at the ROOT of the /tmp emptyDir, one level deep.
# Do not "tidy" these into a /tmp/od-nginx/ subdirectory. Both were tested
# against nginx:1.27-alpine as uid 101 with a read-only root filesystem:
#   pid /tmp/od-nginx/nginx.pid
#     -> [emerg] open() "/tmp/od-nginx/nginx.pid" failed (2: No such file or
#        directory)  -- nginx never creates the pid file's parent directory.
#   proxy_temp_path /tmp/od-nginx/proxy
#     -> [emerg] mkdir() "/tmp/od-nginx/client" failed (2: No such file or
#        directory)  -- ngx_create_paths() is a single mkdir(), not mkdir -p.
# With readOnlyRootFilesystem there is no writable fallback, so either
# mistake is a crash-looping sidecar.
pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr info;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;

    # One level under the /tmp emptyDir -- see the note above the pid.
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 256M;

    # Streaming hygiene: OpenDesign holds long-lived agent streams open.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_request_buffering off;

    sub_filter_once off;
    sub_filter_last_modified on;
    # OpenDesign 0.21.1 serves Turbopack chunks as text/javascript.
    sub_filter_types text/css text/javascript application/javascript application/x-javascript;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Strict-CSRF guard. Normalising Host to the loopback form means a request
    # with NO Origin header takes OpenDesign's `origin == null` branch and is
    # accepted. That is correct for GETs (browsers omit Origin on same-origin
    # subresource GETs) but would leave mutating requests unguarded, so we
    # reject them here. Between this and OD_ALLOWED_ORIGINS, every mutating
    # request must present an Origin AND it must be the allow-listed one.
    map $request_method $od_method_safe {
        default 0;
        GET 1;
        HEAD 1;
        OPTIONS 1;
    }
    map $http_origin $od_has_origin {
        default 1;
        '' 0;
    }
    map "$od_method_safe$od_has_origin" $od_reject_no_origin {
        default 0;
{{- if .Values.nginx.requireOriginOnMutation }}
        # unsafe method (0) + absent Origin (0)
        "00" 1;
{{- end }}
    }

    server {
        listen {{ .Values.nginx.port }} default_server;

        # Served from the ConfigMap, not the image: this container is nginx
        # upstream, so the bridge has to live beside the config.
        location = /od-export-bridge.js {
            alias /usr/share/nginx/od-export-bridge.js;
            default_type application/javascript;
            add_header Cache-Control "no-store";
        }

        location / {
            if ($od_reject_no_origin) {
                return 403;
            }

            proxy_pass http://127.0.0.1:{{ .Values.opendesign.port }};
            proxy_http_version 1.1;
            # The loopback form isAllowedBrowserHost accepts unconditionally.
            proxy_set_header Host 127.0.0.1:{{ .Values.opendesign.port }};
            # Origin is passed through UNCHANGED on purpose. See above.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Required for sub_filter to see the response body at all.
            proxy_set_header Accept-Encoding "";

            # The ONE body rewrite. /export/pdf is the Electron/desktop route
            # and is absent from the daemon's PROJECT_RUN_SCOPED_EXPORT_PATH_RE
            # (server.js:1327); headless-entry.mjs passes
            # desktopArtifactExporter: null, so the UI's PDF button needs this
            # bridge to redirect POST /export/pdf -> /export/pdf-image.
            sub_filter '<head>' '<head><script src="/od-export-bridge.js"></script>';
        }
    }
}
