{{- include "opendesign.validateExtraEnv" . -}}
{{- if and .Values.opendesign.extraEnvSecret.enabled .Values.opendesign.extraEnvSecret.create }}
{{/*
Opt-in. `create: false` (the default) means the Secret already exists and this
chart only references it by name -- nothing to render here at all.

When this DOES render, every value goes through required(): an empty value
would otherwise reach the daemon as an empty variable, which for a provider key
means a silent 401 rather than a loud failure. The keys are documented with
non-credential examples in examples/secrets.example.yaml; real values belong in
a values file that is never committed, or in a Secret created out of band.
*/}}
{{- $cfg := .Values.opendesign.extraEnvSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opendesign.extraEnvSecretName" . }}
  labels:
    {{- include "opendesign.labels" . | nindent 4 }}
    app.kubernetes.io/component: extra-env
  {{- if .Values.keepOnUninstall }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
stringData:
  {{- range $key, $value := $cfg.data }}
  {{ $key }}: {{ required (printf "opendesign.extraEnvSecret.data.%s is empty; every key this chart creates must carry a value" $key) $value | quote }}
  {{- end }}
{{- end }}
