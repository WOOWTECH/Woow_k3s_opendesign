apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "open-design.configMapName" . }}
  labels:
    {{- include "open-design.labels" . | nindent 4 }}
data:
  # Non-sensitive daemon env (upstream 02-config.yaml), consumed via envFrom.
  # OD_DISABLE_API_AUTH is intentionally ABSENT — daemon API auth stays ON behind
  # the public tenant URL (OD_API_TOKEN is injected via the Secret).
  #
  # OD_ALLOWED_ORIGINS: the daemon parses each entry with `new URL()` and CRASHES on
  # a bare "*" (ERR_INVALID_URL — it wants full origin URLs, not a wildcard). It is
  # NOT a CORS allow-all either: isAllowedBrowserOrigin() only trusts a browser Origin
  # that is same-origin AND loopback/private-LAN, OR listed here VERBATIM. A public
  # tenant URL is neither, so the platform MUST pass
  #   config.allowedOrigins = "https://<tenant-host>"
  # for the browser UI/API to work. "*" (and empty) are treated as unset here → the
  # key is omitted → daemon boots (configuredAllowedOrigins() returns [] on unset)
  # but public-origin browser requests get 403 until a real origin is supplied.
  {{- $allowedOrigins := .Values.config.allowedOrigins }}
  {{- if eq $allowedOrigins "*" }}
  {{- $allowedOrigins = "" }}
  {{- end }}
  {{- if $allowedOrigins }}
  OD_ALLOWED_ORIGINS: {{ $allowedOrigins | quote }}
  {{- end }}
  OD_PORT: {{ .Values.service.targetPort | quote }}
  OD_BIND_HOST: {{ .Values.config.bindHost | quote }}
  {{- range $k, $v := .Values.config.extraConfig }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
