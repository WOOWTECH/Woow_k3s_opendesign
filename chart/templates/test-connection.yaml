{{- if .Values.helmTest.enabled }}
{{/*
`helm test` hook: read-only.

It GETs /api/health and /api/version through the Service, which is the exact
path Nginx Proxy Manager takes, so a pass proves Service -> sidecar :{{ .Values.nginx.port }} ->
127.0.0.1:{{ .Values.opendesign.port }} -> daemon end to end. It mounts no PVC, writes nothing, and
sends no method other than GET.

The image is the chart's own, already pinned by digest and already present on
the node, so the hook adds no third-party image to trust.

LABELS: this pod must NOT carry opendesign.selectorLabels. The Service and the
Deployment both select on them, and this pod listens on nothing, so a full
label set would put it in the Service EndpointSlice and black-hole a share of
live traffic for as long as the hook ran.
*/}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "opendesign.fullname" . }}-test-connection
  labels:
    {{- include "opendesign.nonSelectorLabels" . | nindent 4 }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: helm-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: probe
      image: {{ include "opendesign.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - /bin/sh
        - -ceu
        - |
          endpoint="http://{{ include "opendesign.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}"
          # RETRY, and not as garnish. This pod is created seconds before it
          # runs, and the NetworkPolicy that admits it is enforced from an ipset
          # keyed on the pod's IP, which the policy controller has to learn
          # first. Connect too early and the packet is REJECTED -- the probe
          # sees a flat "connection refused" from a Service whose endpoint is
          # perfectly healthy. Measured back-to-back `helm test` runs failing
          # that way roughly half the time without this loop.
          # A pod that is genuinely down still fails, {{ .Values.helmTest.retries }} attempts later.
          attempts={{ .Values.helmTest.retries }}
          get() {
            path=$1
            i=1
            while :; do
              if body="$(wget -q -O- --timeout=10 "${endpoint}${path}" 2>/tmp/wget.err)"; then
                printf '%s' "${body}"
                return 0
              fi
              if [ "${i}" -ge "${attempts}" ]; then
                echo "[test] GET ${path} still failing after ${i} attempt(s):" >&2
                cat /tmp/wget.err >&2
                return 1
              fi
              echo "[test] GET ${path} attempt ${i} failed ($(tr -d '\n' </tmp/wget.err)), retrying" >&2
              i=$((i + 1))
              sleep 2
            done
          }
          echo "[test] GET ${endpoint}/api/health"
          health="$(get /api/health)"
          echo "[test] ${health}"
          case "${health}" in
            *'"ok":true'*) ;;
            *) echo "[test] /api/health did not report ok:true" >&2; exit 1 ;;
          esac
          echo "[test] GET ${endpoint}/api/version"
          version="$(get /api/version)"
          echo "[test] ${version}"
          test -n "${version}"
          echo "[test] the Service reaches the loopback daemon through the sidecar"
      volumeMounts:
        # readOnlyRootFilesystem: the only thing written anywhere is the captured
        # wget stderr, in this emptyDir.
        - name: tmp
          mountPath: /tmp
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        {{- toYaml .Values.helmTest.resources | nindent 8 }}
  volumes:
    - name: tmp
      emptyDir: {}
{{- end }}
