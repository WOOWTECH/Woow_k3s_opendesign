{{- if .Values.console.enabled }}
# Console ServiceAccount — always created with the console (the console Deployment
# references it unconditionally). The Role/RoleBinding below are gated on
# console.rbac.create; with rbac.create=false the SA exists but has no grants
# (console kubectl degrades, pod still schedules).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "open-design.console.serviceAccountName" . }}
  labels:
    {{- include "open-design.console.labels" . | nindent 4 }}
{{- if .Values.console.rbac.create }}
---
# Namespaced Role, no cluster-wide grants, and EVERY rule is pinned by resourceNames
# to this release's own objects (#1360). The workspace namespace also hosts the
# tenant's other services (Odoo + PostgreSQL, n8n, Hermes, mcp-* tokens), so a
# namespace-wide pods/exec would let anyone holding the OpenDesign credential exec
# into all of them. The daemon is a StatefulSet precisely so its pod name
# (<fullname>-0) is known here; RBAC cannot select pods by label.
# No list/watch on anything: the console never enumerates the namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "open-design.console.fullname" . }}
  labels:
    {{- include "open-design.console.labels" . | nindent 4 }}
rules:
  # `kubectl exec POD` / `kubectl logs POD` GET the pod first; the terminal waits on it.
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: ["{{ include "open-design.daemonPodName" . }}"]
    verbs: ["get"]
  # Exec into the daemon (the ttyd terminal, dashboard health/agents probes).
  - apiGroups: [""]
    resources: ["pods/exec"]
    resourceNames: ["{{ include "open-design.daemonPodName" . }}"]
    verbs: ["create", "get"]
  # Read the daemon's logs.
  - apiGroups: [""]
    resources: ["pods/log"]
    resourceNames: ["{{ include "open-design.daemonPodName" . }}"]
    verbs: ["get"]
  # Restart the daemon (rollout restart = PATCH of the pod template annotation). The
  # console never scales, so the scale subresource is intentionally NOT granted.
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: ["{{ include "open-design.fullname" . }}"]
    verbs: ["get", "patch"]
  # NO Secret access (console-ttyd-exposure, X-SEC-005-4 / AI-HER-008-6): nothing in the
  # console (app.py, connect.sh, entrypoint.py) reads or writes the chart Secret — the
  # admin password reaches it as env (secretKeyRef, resolved by the kubelet, not by this
  # SA). The old get/patch/update rule only let a token stolen from the console pod read
  # admin_password / API keys and rewrite them. Key changes go through the platform.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "open-design.console.fullname" . }}
  labels:
    {{- include "open-design.console.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "open-design.console.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "open-design.console.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
