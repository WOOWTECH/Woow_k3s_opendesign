{{- /* storageClass: per-volume override wins, else the flat persistence.storageClass
       (the key the platform operator's _inject_storage_class targets). */ -}}
{{- if .Values.persistence.data.enabled }}
{{- $dataSC := .Values.persistence.data.storageClass | default .Values.persistence.storageClass }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "open-design.dataPvcName" . }}
  labels:
    {{- include "open-design.labels" . | nindent 4 }}
    open-design.woowtech.io/volume: data
spec:
  accessModes:
    {{- toYaml .Values.persistence.data.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.size }}
  {{- with $dataSC }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
{{- if .Values.persistence.home.enabled }}
{{- $homeSC := .Values.persistence.home.storageClass | default .Values.persistence.storageClass }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "open-design.homePvcName" . }}
  labels:
    {{- include "open-design.labels" . | nindent 4 }}
    open-design.woowtech.io/volume: home
spec:
  accessModes:
    {{- toYaml .Values.persistence.home.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.home.size }}
  {{- with $homeSC }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
