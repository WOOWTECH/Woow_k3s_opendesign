{{- if .Values.console.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "open-design.console.fullname" . }}
  labels:
    {{- include "open-design.console.labels" . | nindent 4 }}
spec:
  type: {{ .Values.console.service.type }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.console.service.dashboardPort }}
      targetPort: http
    - name: ttyd
      protocol: TCP
      port: {{ .Values.console.service.ttydPort }}
      targetPort: ttyd
  selector:
    {{- include "open-design.console.selectorLabels" . | nindent 4 }}
{{- end }}
