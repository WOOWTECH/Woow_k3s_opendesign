{{- if not .Values.auth.existingSecret }}
{{- /*
  Chart-managed Secret (skipped when auth.existingSecret is set — CD/operator then
  provides its own Secret with keys admin_password / OD_API_TOKEN / ANTHROPIC_API_KEY /
  OPENROUTER_API_KEY).

  admin_password (Option C tenant credential) and OD_API_TOKEN (internal) self-generate
  + persist (lookup) when not pinned, so a `helm upgrade` does NOT churn them. The
  platform #357 has_admin_gui mechanism pins config.sensitive.admin_password.
*/ -}}
{{- $adminPassword := include "open-design.resolveSecretValue" (dict "ctx" . "explicit" .Values.config.sensitive.admin_password "key" "admin_password" "gen" "alnum24") -}}
{{- $odApiToken := include "open-design.resolveSecretValue" (dict "ctx" . "explicit" .Values.auth.odApiToken "key" "OD_API_TOKEN" "gen" "hex32") -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "open-design.secretName" . }}
  labels:
    {{- include "open-design.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Tenant credential (Option C): the auth-proxy HTTP basic-auth password AND the
  # console gate. Platform #357 pins config.sensitive.admin_password; else self-gen.
  admin_password: {{ $adminPassword | quote }}
  # Basic-auth username shared by the auth-proxy and the console (validated by
  # open-design.basicAuthUsername). Kept here, not in the pod specs, so changing it
  # never changes a pod template — see deployment.yaml.
  admin_username: {{ include "open-design.basicAuthUsername" . | quote }}
  {{- if .Values.authProxy.basicAuth.enabled }}
  # nginx basic-auth file for the daemon's auth-proxy, mounted as a Secret volume so a
  # password reset reaches the running nginx without a pod restart (#1360). {PLAIN}:
  # admin_password is already plaintext in this Secret, and it avoids bcrypt-salt churn
  # on every upgrade. CR/LF stripped so the password cannot inject a second line.
  htpasswd: {{ printf "%s:{PLAIN}%s\n" (include "open-design.basicAuthUsername" .) ($adminPassword | replace "\r" "" | replace "\n" "") | quote }}
  {{- end }}
  # INTERNAL daemon API token (defense-in-depth; nginx reaches the daemon over
  # loopback, which the daemon exempts — the tenant never sees this).
  OD_API_TOKEN: {{ $odApiToken | quote }}
  # Optional tenant LLM keys. ALWAYS rendered, "" when unset (#1556): a key dropped
  # from stringData is never deleted from the live Secret's data (helm's three-way
  # patch only removes the stringData entry), so a key the tenant cleared kept
  # reaching the daemon. "" clears it; every consumer treats "" as no key
  # (files/agent-defaults.py strips + bool(), the agent CLIs read it the same way).
  # ANTHROPIC_API_KEY — run agent CLIs headless without an interactive login.
  ANTHROPIC_API_KEY: {{ .Values.auth.anthropicApiKey | default "" | toString | quote }}
  # OPENROUTER_API_KEY — server-side OpenRouter key for the in-container OpenCode runtime.
  OPENROUTER_API_KEY: {{ .Values.auth.openrouterApiKey | default "" | toString | quote }}
{{- end }}
