apiVersion: v1
kind: Service
metadata:
  # Daemon Service — service.name override (canonical ecosystem name
  # "open-design-svc") or the release fullname. mcp-opendesign's od_api_base points
  # here: http://<this-name>:{{ .Values.service.port }}.
  name: {{ include "open-design.serviceName" . }}
  labels:
    {{- include "open-design.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      # Option C: route to the in-pod auth-proxy (basic-auth gate), NOT the daemon
      # directly. authProxy.enabled=false → route straight to the daemon.
      targetPort: {{ if .Values.authProxy.enabled }}proxy{{ else }}http{{ end }}
      protocol: TCP
  selector:
    {{- include "open-design.selectorLabels" . | nindent 4 }}
