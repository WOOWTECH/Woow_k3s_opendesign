{{- if .Values.console.enabled }}
# Console app code — chart-owned, injected into the console container at startup
# (baked mode) or after the runtime bootstrap (runtimeInstall mode). Kept in a
# ConfigMap so app changes ship WITHOUT rebuilding the console image. Targets are
# env-driven (DAEMON_POD / DAEMON_CONTAINER / DAEMON_STATEFULSET / DAEMON_PORT) so
# the console works under any release name (e.g. svc-{ref[:8]}), unlike the
# upstream hard-coded "app=open-design".
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "open-design.console.scriptsConfigMapName" . }}
  labels:
    {{- include "open-design.console.labels" . | nindent 4 }}
data:
  app.py: |
    #!/usr/bin/env python3
    """Open Design Console — Flask management dashboard."""
    import base64
    import json
    import os
    import subprocess
    import threading
    import time
    from datetime import datetime, timezone

    from flask import Flask, Response, jsonify, render_template, request

    app = Flask(__name__)

    NAMESPACE = os.environ.get("NAMESPACE", "open-design")
    CONTAINER = os.environ.get("DAEMON_CONTAINER", "open-design")
    DAEMON_PORT = os.environ.get("DAEMON_PORT", "7457")
    DAEMON_STATEFULSET = os.environ.get("DAEMON_STATEFULSET", "open-design")
    DAEMON_POD = os.environ.get("DAEMON_POD", "open-design-0")
    DASHBOARD_PORT = int(os.environ.get("CONSOLE_DASHBOARD_PORT", "18790"))

    # Console gate (Option C — "同一閘"): HTTP basic-auth using the tenant
    # admin_password (passed as TUI_PASSWORD). Same credential as the daemon
    # auth-proxy + ttyd. Empty password → open (should not happen in production).
    BASIC_USER = os.environ.get("CONSOLE_BASIC_USER", "admin")
    BASIC_PASS = os.environ.get("TUI_PASSWORD", "")


    @app.before_request
    def _require_basic_auth():
        challenge = Response("Authentication required", 401,
                             {"WWW-Authenticate": 'Basic realm="Open Design Console"'})
        # Fail CLOSED: an unset/empty password must NOT expose the console (it can
        # kubectl-exec a web shell into the daemon and restart it).
        if not BASIC_PASS:
            return challenge
        hdr = request.headers.get("Authorization", "")
        if hdr.startswith("Basic "):
            try:
                user, _, pw = base64.b64decode(hdr[6:]).decode("utf-8").partition(":")
                if user == BASIC_USER and pw == BASIC_PASS:
                    return None
            except Exception:
                pass
        return challenge

    # Health history
    health_history = []
    health_lock = threading.Lock()

    # Response cache for expensive kubectl+curl calls
    _cache = {}
    _cache_lock = threading.Lock()
    CACHE_TTL = 15  # seconds


    def _cache_get(key):
        with _cache_lock:
            entry = _cache.get(key)
            if entry and time.time() - entry["ts"] < CACHE_TTL:
                return entry["val"]
        return None


    def _cache_set(key, val):
        with _cache_lock:
            _cache[key] = {"val": val, "ts": time.time()}


    def get_pod_name():
        """The daemon pod — fixed name (StatefulSet ordinal 0, #1360).

        The console SA may only touch this one pod (RBAC resourceNames), so there
        is nothing to discover: no pods list, no label selector.
        """
        return DAEMON_POD


    def kexec(cmd):
        """Execute command inside open-design pod, return stdout."""
        pod = get_pod_name()
        if not pod:
            return None
        try:
            result = subprocess.run(
                ["kubectl", "exec", pod, "-n", NAMESPACE, "-c", CONTAINER,
                 "--", "sh", "-c", cmd],
                capture_output=True, text=True, timeout=15
            )
            return result.stdout
        except Exception:
            return None


    def health_check_loop():
        """Background: check open-design health every 60s."""
        time.sleep(15)
        while True:
            try:
                pod = get_pod_name()
                ts = datetime.now(timezone.utc).isoformat()
                if pod:
                    raw = kexec("curl -s http://localhost:%s/api/health 2>/dev/null" % DAEMON_PORT)
                    try:
                        data = json.loads(raw) if raw else {}
                        ok = data.get("ok", False)
                    except Exception:
                        ok = False
                    entry = {"ts": ts, "pod": pod, "ok": ok}
                else:
                    entry = {"ts": ts, "pod": None, "ok": False}

                with health_lock:
                    health_history.append(entry)
                    if len(health_history) > 100:
                        health_history.pop(0)
            except Exception:
                pass
            time.sleep(60)


    # Start health check background thread
    threading.Thread(target=health_check_loop, daemon=True).start()


    @app.route("/")
    def index():
        return render_template("index.html")


    def _fetch_health_data():
        """Fetch health data with caching."""
        cached = _cache_get("health_data")
        if cached is not None:
            return cached
        raw = kexec("curl -s http://localhost:%s/api/health 2>/dev/null" % DAEMON_PORT)
        try:
            data = json.loads(raw) if raw else {}
        except Exception:
            data = {}
        _cache_set("health_data", data)
        return data


    @app.route("/api/status")
    def api_status():
        pod = get_pod_name()
        if not pod:
            return jsonify({"ok": False, "pod": None, "message": "Pod not found"})

        health = _fetch_health_data()
        agents_data = _fetch_agents_data()
        agents_available = []
        for a in agents_data.get("agents", []):
            if a.get("available"):
                agents_available.append({
                    "id": a["id"],
                    "name": a.get("name", a["id"]),
                    "version": a.get("version", "unknown"),
                    "path": a.get("path", ""),
                })

        return jsonify({
            "ok": health.get("ok", False),
            "pod": pod,
            "version": health.get("version", "unknown"),
            "agents": agents_available,
            "namespace": NAMESPACE,
        })


    @app.route("/api/health-history")
    def api_health_history():
        with health_lock:
            return jsonify(list(health_history))


    def _fetch_agents_data():
        """Fetch agents data with caching."""
        cached = _cache_get("agents_data")
        if cached is not None:
            return cached
        raw = kexec("curl -s http://localhost:%s/api/agents 2>/dev/null" % DAEMON_PORT)
        try:
            data = json.loads(raw) if raw else {}
        except Exception:
            data = {}
        _cache_set("agents_data", data)
        return data


    @app.route("/api/agents")
    def api_agents():
        data = _fetch_agents_data()
        if data:
            return jsonify(data)
        return jsonify({"agents": [], "error": "Failed to fetch agents"})


    @app.route("/api/logs")
    def api_logs():
        lines_param = request.args.get("lines", "100")
        try:
            lines = int(lines_param)
            if lines < 1:
                return jsonify({"error": "lines must be a positive integer"}), 400
            lines = min(lines, 10000)  # cap at 10k
        except (ValueError, TypeError):
            return jsonify({"error": "lines must be a valid integer"}), 400
        # #1360: by pod name, not `-l` — a label selector needs `pods list`, and
        # the console may only read this one pod's logs.
        pod = get_pod_name()
        try:
            result = subprocess.run(
                ["kubectl", "logs", pod, "--tail", str(lines),
                 "-n", NAMESPACE, "-c", CONTAINER],
                capture_output=True, text=True, timeout=15
            )
            if result.returncode != 0:
                return jsonify({"logs": "", "error": result.stderr.strip() or "Pod not found"})
            return jsonify({"logs": result.stdout})
        except Exception as e:
            return jsonify({"logs": "", "error": str(e)})


    @app.route("/api/restart", methods=["POST"])
    def api_restart():
        try:
            result = subprocess.run(
                ["kubectl", "rollout", "restart",
                 "statefulset/%s" % DAEMON_STATEFULSET, "-n", NAMESPACE],
                capture_output=True, text=True, timeout=15
            )
            return jsonify({"ok": result.returncode == 0, "message": result.stdout})
        except Exception as e:
            return jsonify({"ok": False, "error": str(e)})


    if __name__ == "__main__":
        app.run(host="0.0.0.0", port=DASHBOARD_PORT, debug=False)
  connect.sh: |
    #!/bin/sh
    # ttyd wrapper: kubectl exec into the open-design daemon container

    NAMESPACE="${NAMESPACE:-open-design}"
    POD="${DAEMON_POD:-open-design-0}"
    CONTAINER="${DAEMON_CONTAINER:-open-design}"

    while true; do
      # #1360: the daemon pod has a fixed name (StatefulSet ordinal 0) and the
      # console SA may only get/exec that one pod — no namespace-wide listing.
      PHASE=$(kubectl get pod "$POD" -n "$NAMESPACE" -o jsonpath='{.status.phase}' 2>/dev/null)

      if [ "$PHASE" = "Running" ]; then
        echo ""
        echo "==================================================="
        echo "  Open Design Terminal — connected to: $POD"
        echo "  Type 'exit' to disconnect (auto-reconnects)"
        echo "==================================================="
        echo ""
        kubectl exec -it "$POD" -n "$NAMESPACE" -c "$CONTAINER" -- /bin/bash
        echo ""
        echo "Session ended. Reconnecting in 2s..."
        sleep 2
      else
        echo "Waiting for open-design pod to be ready..."
        sleep 5
      fi
    done
  entrypoint.py: |
    #!/usr/bin/env python3
    """Console entrypoint — runs Flask + ttyd + the Basic-auth front side by side.

    console-ttyd-exposure (AI-HER-006-4 / X-SEC-002-1): ttyd used to start as
    `ttyd -c <user>:<admin_password>`, which put the tenant admin password into
    /proc/<pid>/cmdline and made ttyd print `credential: <base64(user:password)>`
    into the pod log. Now:
      * ttyd listens on loopback only (-i lo, CONSOLE_TTYD_INTERNAL_PORT) with a
        random per-boot credential that is NOT the admin password;
      * the front (this file, `entrypoint.py authfront`, a supervised child) owns the
        public port CONSOLE_TTYD_PORT (Service / NetworkPolicy / auth-proxy unchanged),
        checks HTTP Basic against admin_password (read from the environment, never
        from argv), and forwards the request to ttyd with ttyd's own credential;
      * the admin password is never written to argv or to the log.
    """
    import asyncio
    import base64
    import hmac
    import os
    import secrets
    import signal
    import subprocess
    import sys

    BASIC_USER = os.environ.get("CONSOLE_BASIC_USER", "admin")
    TUI_PASSWORD = os.environ.get("TUI_PASSWORD", "")
    TTYD_PORT = os.environ.get("CONSOLE_TTYD_PORT", "7681")
    TTYD_INTERNAL_PORT = os.environ.get("CONSOLE_TTYD_INTERNAL_PORT", "") or str(int(TTYD_PORT) + 1)
    DASHBOARD_PORT = os.environ.get("CONSOLE_DASHBOARD_PORT", "18790")
    APP_DIR = os.environ.get("CONSOLE_APP_DIR", "/app")
    # When the auth-proxy exposes ttyd at a sub-path (console.externalPath), ttyd must
    # run with `-b <path>` so its index/asset/WS URLs are emitted under that base and
    # survive the reverse proxy. Empty → served at root (no external sub-path route).
    BASE_PATH = os.environ.get("CONSOLE_BASE_PATH", "").strip()

    REALM = 'Basic realm="Console"'
    MAX_HEAD = 16384          # request line + headers
    MAX_BODY = 65536          # ttyd takes no request bodies; anything bigger is refused
    IDLE_TIMEOUT = 60         # seconds to wait for a request head
    FAIL_DELAY = 1.0          # slow down guessing that bypasses the auth-proxy lockout


    def _reply(writer, status, extra=b""):
        writer.write(b"HTTP/1.1 " + status + b"\r\nContent-Length: 0\r\nConnection: close\r\n" + extra + b"\r\n")


    async def _pipe(reader, writer):
        try:
            while True:
                data = await reader.read(65536)
                if not data:
                    break
                writer.write(data)
                await writer.drain()
        except (ConnectionError, asyncio.CancelledError):
            pass
        finally:
            try:
                writer.close()
            except Exception:  # noqa: BLE001
                pass


    async def _relay_response(up_reader, writer):
        """Relay ONE response, marked Connection: close, then stop: the client opens a new
        connection (and passes the gate again) for its next request."""
        head = await asyncio.wait_for(up_reader.readuntil(b"\r\n\r\n"), IDLE_TIMEOUT)
        lines = head[:-4].split(b"\r\n")
        keep = [l for l in lines[1:] if l.partition(b":")[0].strip().lower() not in (b"connection", b"keep-alive")]
        writer.write(b"\r\n".join([lines[0]] + keep + [b"Connection: close"]) + b"\r\n\r\n")
        status = lines[0].split(b" ")[1] if len(lines[0].split(b" ")) > 1 else b""
        lengths = [l.partition(b":")[2].strip() for l in keep if l.partition(b":")[0].strip().lower() == b"content-length"]
        chunked = any(l.partition(b":")[0].strip().lower() == b"transfer-encoding" for l in keep)
        if status[:1] == b"1" or status in (b"204", b"304"):
            remaining = 0
        elif lengths and not chunked and lengths[0].isdigit():
            remaining = int(lengths[0])
        else:
            remaining = -1   # until ttyd closes (it got Connection: close)
        while remaining != 0:
            data = await up_reader.read(65536 if remaining < 0 else min(65536, remaining))
            if not data:
                break
            writer.write(data)
            await writer.drain()
            if remaining > 0:
                remaining -= len(data)
        await writer.drain()


    def _authorized(values, expected):
        """Exactly one Authorization header, scheme Basic, user:password == expected (constant time)."""
        if len(values) != 1:
            return False
        scheme, _, token = values[0].strip().partition(b" ")
        if scheme.lower() != b"basic":
            return False
        try:
            given = base64.b64decode(token.strip(), validate=True)
        except Exception:  # noqa: BLE001
            return False
        return hmac.compare_digest(given, expected)


    async def _handle(reader, writer, expected, upstream_auth, upstream_port):
        try:
            try:
                head = await asyncio.wait_for(reader.readuntil(b"\r\n\r\n"), IDLE_TIMEOUT)
            except (asyncio.IncompleteReadError, asyncio.TimeoutError, ConnectionError):
                return
            except asyncio.LimitOverrunError:
                _reply(writer, b"431 Request Header Fields Too Large")
                return
            lines = head[:-4].split(b"\r\n")
            request_line, headers = lines[0], []
            for line in lines[1:]:
                name, sep, value = line.partition(b":")
                if not sep or not name or name != name.strip():
                    _reply(writer, b"400 Bad Request")
                    return
                headers.append((name, value.strip()))
            lower = [(n.lower(), v) for n, v in headers]

            if not _authorized([v for n, v in lower if n == b"authorization"], expected):
                if any(n == b"authorization" for n, _ in lower):
                    await asyncio.sleep(FAIL_DELAY)
                _reply(writer, b"401 Unauthorized", b"WWW-Authenticate: " + REALM.encode() + b"\r\n")
                return

            if any(n == b"transfer-encoding" for n, _ in lower):
                _reply(writer, b"400 Bad Request")
                return
            lengths = [v for n, v in lower if n == b"content-length"]
            try:
                body_len = int(lengths[0]) if lengths else 0
            except ValueError:
                body_len = -1
            if len(lengths) > 1 or body_len < 0 or body_len > MAX_BODY:
                _reply(writer, b"400 Bad Request")
                return
            upgrade = any(n == b"upgrade" and v.lower() == b"websocket" for n, v in lower)

            # Never forward the admin credential; ttyd gets its own. A plain HTTP request
            # is one request per connection (Connection: close), so nothing after the head
            # this front checked can reach ttyd on the same connection.
            drop = {b"authorization", b"proxy-authorization"}
            if not upgrade:
                drop |= {b"connection", b"keep-alive", b"proxy-connection", b"upgrade"}
            out = [request_line]
            out += [n + b": " + v for n, v in headers if n.lower() not in drop]
            out.append(b"Authorization: " + upstream_auth)
            if not upgrade:
                out.append(b"Connection: close")
            body = await reader.readexactly(body_len) if body_len else b""

            try:
                up_reader, up_writer = await asyncio.open_connection("127.0.0.1", upstream_port)
            except OSError:
                _reply(writer, b"502 Bad Gateway")
                return
            up_writer.write(b"\r\n".join(out) + b"\r\n\r\n" + body)
            await up_writer.drain()
            if upgrade:
                await asyncio.gather(_pipe(reader, up_writer), _pipe(up_reader, writer))
            else:
                await _relay_response(up_reader, writer)
                up_writer.close()
        except Exception:  # noqa: BLE001 — one bad connection must never stop the front
            pass
        finally:
            try:
                writer.close()
            except Exception:  # noqa: BLE001
                pass


    def authfront():
        """`entrypoint.py authfront`: the public console port; credentials come from the environment."""
        upstream = os.environ.pop("CONSOLE_UPSTREAM_CREDENTIAL", "")
        if not TUI_PASSWORD or not upstream:
            print("[authfront] FATAL: missing credentials — refusing to start.", flush=True)
            sys.exit(1)
        expected = ("%s:%s" % (BASIC_USER, TUI_PASSWORD)).encode()
        upstream_auth = b"Basic " + base64.b64encode(upstream.encode())
        upstream_port = int(TTYD_INTERNAL_PORT)

        async def serve():
            server = await asyncio.start_server(
                lambda r, w: _handle(r, w, expected, upstream_auth, upstream_port),
                host="0.0.0.0", port=int(TTYD_PORT), limit=MAX_HEAD)
            print("[authfront] Basic gate on :%s → ttyd 127.0.0.1:%d" % (TTYD_PORT, upstream_port), flush=True)
            async with server:
                await server.serve_forever()

        asyncio.run(serve())


    def main():
        # Fail CLOSED: never start the web terminal without a password (ttyd would
        # otherwise expose an unauthenticated kubectl-exec shell into the daemon).
        if not TUI_PASSWORD:
            print("[entrypoint] FATAL: TUI_PASSWORD (admin_password) is empty — refusing to start.", flush=True)
            sys.exit(1)

        # ttyd: web terminal that kubectl-execs into the daemon pod. Loopback only, with a
        # random per-boot credential: only the front below can reach it, and neither this
        # argv nor ttyd's "credential:" log line carries the admin password.
        upstream_cred = "console:" + secrets.token_urlsafe(32)
        ttyd_cmd = [
            "ttyd", "-i", "lo", "-p", TTYD_INTERNAL_PORT,
            "-c", upstream_cred,
            "-W",
        ]
        if BASE_PATH:
            ttyd_cmd += ["-b", BASE_PATH]
        ttyd_cmd += [os.path.join(APP_DIR, "connect.sh")]
        # ttyd and every terminal session (connect.sh → kubectl) never see the admin password.
        ttyd_env = {k: v for k, v in os.environ.items() if k != "TUI_PASSWORD"}
        ttyd_proc = subprocess.Popen(ttyd_cmd, env=ttyd_env)
        print("[entrypoint] ttyd started on 127.0.0.1:%s (PID %d)" % (TTYD_INTERNAL_PORT, ttyd_proc.pid), flush=True)

        # The front: public console port, Basic gate with the SAME user/password as the
        # daemon proxy (同一閘). The per-boot credential goes through the environment.
        front_env = dict(os.environ, CONSOLE_UPSTREAM_CREDENTIAL=upstream_cred)
        front_proc = subprocess.Popen([sys.executable, os.path.abspath(__file__), "authfront"], env=front_env)
        print("[entrypoint] console front started on :%s (PID %d)" % (TTYD_PORT, front_proc.pid), flush=True)

        # Flask: management dashboard
        flask_proc = subprocess.Popen(
            [sys.executable, os.path.join(APP_DIR, "app.py")],
            cwd=APP_DIR,
        )
        print("[entrypoint] Flask started on :%s (PID %d)" % (DASHBOARD_PORT, flask_proc.pid), flush=True)
        children = (ttyd_proc, front_proc, flask_proc)

        def shutdown(sig, frame):
            print("\n[entrypoint] Received signal %s, shutting down..." % sig, flush=True)
            for p in children:
                p.terminate()
            sys.exit(0)

        signal.signal(signal.SIGTERM, shutdown)
        signal.signal(signal.SIGINT, shutdown)

        # Wait for one of OUR OWN children to exit. As PID 1 this process also
        # inherits orphaned grandchildren: every ttyd session spawns
        # connect.sh, whose children are re-parented here once the user
        # closes the terminal tab. Reaping them is a PID-1 duty, but they must
        # NOT be mistaken for a supervised service dying — otherwise closing a
        # tab kills the whole container, and readinessProbe.initialDelaySeconds
        # then blackholes /console for ~60s on every session end.
        supervised = {ttyd_proc.pid: "ttyd", front_proc.pid: "console front", flask_proc.pid: "Flask"}
        while True:
            try:
                pid, status = os.waitpid(-1, 0)
            except ChildProcessError:
                print("[entrypoint] No children left, shutting down...", flush=True)
                break
            if pid not in supervised:
                # Orphan from a finished terminal session — reaped, keep serving.
                continue
            print("[entrypoint] %s (PID %d) exited with %d, shutting down..."
                  % (supervised[pid], pid, status), flush=True)
            break

        for p in children:
            p.terminate()
        sys.exit(1)


    if __name__ == "__main__":
        if sys.argv[1:] == ["authfront"]:
            authfront()
        else:
            main()
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "open-design.console.fullname" . }}-html
  labels:
    {{- include "open-design.console.labels" . | nindent 4 }}
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Design Console</title>
    <style>
      :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #e6edf3; --dim: #8b949e; --accent: #58a6ff; --green: #3fb950; --red: #f85149; --yellow: #d29922; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
      .header { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
      .header h1 { font-size: 20px; font-weight: 600; }
      .header .badge { font-size: 12px; padding: 2px 8px; border-radius: 12px; background: var(--green); color: #000; font-weight: 600; }
      .header .badge.offline { background: var(--red); color: #fff; }
      .tabs { display: flex; gap: 0; background: var(--card); border-bottom: 1px solid var(--border); padding: 0 24px; }
      .tab { padding: 12px 20px; cursor: pointer; color: var(--dim); border-bottom: 2px solid transparent; font-size: 14px; font-weight: 500; transition: all 0.2s; }
      .tab:hover { color: var(--text); }
      .tab.active { color: var(--text); border-bottom-color: var(--accent); }
      .content { padding: 24px; max-width: 1200px; margin: 0 auto; }
      .panel { display: none; }
      .panel.active { display: block; }
      .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
      .card h3 { font-size: 14px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
      .stat { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
      .stat .label { color: var(--dim); min-width: 120px; font-size: 14px; }
      .stat .value { font-weight: 500; font-size: 14px; }
      .stat .dot { width: 8px; height: 8px; border-radius: 50%; }
      .dot.green { background: var(--green); }
      .dot.red { background: var(--red); }
      .dot.yellow { background: var(--yellow); }
      .agents-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
      .agent-card { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 14px; }
      .agent-card .name { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
      .agent-card .version { color: var(--dim); font-size: 13px; }
      .agent-card .path { color: var(--dim); font-size: 12px; font-family: monospace; margin-top: 6px; word-break: break-all; }
      .terminal-frame { width: 100%; height: calc(100vh - 160px); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
      .terminal-frame iframe { width: 100%; height: 100%; border: none; }
      .logs-box { background: #000; color: #0f0; font-family: 'Courier New', monospace; font-size: 13px; padding: 16px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; max-height: calc(100vh - 240px); overflow-y: auto; line-height: 1.5; }
      .toolbar { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; }
      .btn { padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; }
      .btn:hover { border-color: var(--accent); }
      .btn.danger { border-color: var(--red); color: var(--red); }
      .btn.danger:hover { background: var(--red); color: #fff; }
      .refresh-indicator { color: var(--dim); font-size: 12px; margin-left: auto; }
    </style>
    </head>
    <body>

    <div class="header">
      <h1>Open Design Console</h1>
      <span class="badge" id="statusBadge">Loading...</span>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('dashboard')">Dashboard</div>
      <div class="tab" onclick="switchTab('terminal')">Terminal</div>
      <div class="tab" onclick="switchTab('logs')">Logs</div>
    </div>

    <div class="content">
      <!-- Dashboard Panel -->
      <div class="panel active" id="panel-dashboard">
        <div class="card">
          <h3>System Status</h3>
          <div class="stat"><span class="label">Status</span><span class="dot" id="healthDot"></span><span class="value" id="healthText">--</span></div>
          <div class="stat"><span class="label">Pod</span><span class="value" id="podName">--</span></div>
          <div class="stat"><span class="label">Version</span><span class="value" id="appVersion">--</span></div>
          <div class="stat"><span class="label">Namespace</span><span class="value" id="nsName">--</span></div>
        </div>

        <div class="card">
          <h3>Available Agent CLIs</h3>
          <div class="agents-grid" id="agentsGrid">
            <div style="color: var(--dim)">Loading...</div>
          </div>
        </div>

        <div class="card">
          <h3>Actions</h3>
          <div class="toolbar">
            <button class="btn" onclick="refreshStatus()">Refresh Status</button>
            <button class="btn danger" onclick="restartDaemon()">Restart Daemon</button>
          </div>
        </div>
      </div>

      <!-- Terminal Panel -->
      <div class="panel" id="panel-terminal">
        <div class="terminal-frame">
          <iframe id="ttydFrame" src="about:blank"></iframe>
        </div>
      </div>

      <!-- Logs Panel -->
      <div class="panel" id="panel-logs">
        <div class="toolbar">
          <button class="btn" onclick="refreshLogs()">Refresh</button>
          <select id="logLines" class="btn" onchange="refreshLogs()">
            <option value="50">50 lines</option>
            <option value="100" selected>100 lines</option>
            <option value="300">300 lines</option>
            <option value="500">500 lines</option>
          </select>
          <span class="refresh-indicator" id="logsTime"></span>
        </div>
        <div class="logs-box" id="logsBox">Loading logs...</div>
      </div>
    </div>

    <script>
    const TTYD_PORT = {{ .Values.console.service.ttydPort }};
    const TTYD_BASE_PATH = {{ default "" .Values.console.externalPath | trimSuffix "/" | toJson }};

    function switchTab(name) {
      document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', ['dashboard','terminal','logs'][i] === name);
      });
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById('panel-' + name).classList.add('active');

      if (name === 'terminal') {
        const frame = document.getElementById('ttydFrame');
        if (frame.src === 'about:blank') {
          // Use same host but ttyd port
          const loc = window.location;
          frame.src = loc.protocol + '//' + loc.hostname + ':' + TTYD_PORT + TTYD_BASE_PATH + '/';
        }
      }
      if (name === 'logs') refreshLogs();
    }

    async function refreshStatus() {
      try {
        const r = await fetch('/api/status');
        const d = await r.json();
        const badge = document.getElementById('statusBadge');
        const dot = document.getElementById('healthDot');
        const text = document.getElementById('healthText');

        if (d.ok) {
          badge.textContent = 'Online';
          badge.className = 'badge';
          dot.className = 'dot green';
          text.textContent = 'Healthy';
        } else {
          badge.textContent = 'Offline';
          badge.className = 'badge offline';
          dot.className = 'dot red';
          text.textContent = d.message || 'Unhealthy';
        }
        document.getElementById('podName').textContent = d.pod || '--';
        document.getElementById('appVersion').textContent = d.version || '--';
        document.getElementById('nsName').textContent = d.namespace || '--';

        const grid = document.getElementById('agentsGrid');
        if (d.agents && d.agents.length > 0) {
          grid.innerHTML = d.agents.map(a => `
            <div class="agent-card">
              <div class="name">${a.name}</div>
              <div class="version">v${a.version}</div>
              <div class="path">${a.path}</div>
            </div>
          `).join('');
        } else {
          grid.innerHTML = '<div style="color: var(--dim)">No agents detected</div>';
        }
      } catch (e) {
        document.getElementById('statusBadge').textContent = 'Error';
        document.getElementById('statusBadge').className = 'badge offline';
      }
    }

    async function refreshLogs() {
      const lines = document.getElementById('logLines').value;
      try {
        const r = await fetch('/api/logs?lines=' + lines);
        const d = await r.json();
        document.getElementById('logsBox').textContent = d.logs || '(no logs)';
        document.getElementById('logsTime').textContent = 'Updated: ' + new Date().toLocaleTimeString();
        const box = document.getElementById('logsBox');
        box.scrollTop = box.scrollHeight;
      } catch (e) {
        document.getElementById('logsBox').textContent = 'Failed to fetch logs: ' + e.message;
      }
    }

    async function restartDaemon() {
      if (!confirm('Restart the open-design daemon? Active sessions will be interrupted.')) return;
      try {
        const r = await fetch('/api/restart', { method: 'POST' });
        const d = await r.json();
        alert(d.ok ? 'Restart initiated' : 'Restart failed: ' + (d.error || d.message));
        setTimeout(refreshStatus, 10000);
      } catch (e) {
        alert('Error: ' + e.message);
      }
    }

    // Auto-refresh status every 30s
    refreshStatus();
    setInterval(refreshStatus, 30000);
    </script>

    </body>
    </html>
{{- end }}
