{{- if and (not .Values.authProxy.enabled) (has (lower .Values.config.bindHost) (list "127.0.0.1" "localhost" "::1")) }}
{{- fail "authProxy.enabled=false requires config.bindHost=0.0.0.0 (a loopback-bound daemon with no in-pod proxy is unreachable)" }}
{{- end }}
{{- $daemonPort := .Values.service.targetPort -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "open-design.fullname" . }}
  labels:
    {{- include "open-design.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # TWO RWO PVCs (/app/.od, /home/opendesign) → Recreate, NOT RollingUpdate.
  # RollingUpdate starts the replacement pod before terminating the old one; both
  # would contend for the same RWO volumes → "Multi-Attach error" deadlock.
  # Recreate releases the PVCs first. Safe here: per-instance single-replica.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "open-design.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "open-design.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Roll the pod when the auth-proxy / daemon ConfigMap changes. subPath mounts
        # don't hot-update and a ConfigMap edit alone won't roll the Deployment, so
        # without this an upgrade that only touches the nginx config (e.g. the console
        # /console route) never reaches the running nginx. gap #49.
        checksum/authproxy-config: {{ include (print $.Template.BasePath "/auth-proxy-configmap.yaml") . | sha256sum }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "open-design.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $seedHome := .Values.homeSeed.enabled -}}
      {{- $authInit := and .Values.authProxy.enabled .Values.authProxy.basicAuth.enabled -}}
      {{- if or $seedHome $authInit }}
      initContainers:
      {{- end }}
      {{- if $seedHome }}
        # Seed the default dotfiles into the home PVC — fill gaps only, NEVER overwrite.
        #
        # WHY: od-home mounts OVER /home/opendesign and SHADOWS the home baked into
        # the image; the kubelet does NOT replay /etc/skel into a fresh volume, so a
        # brand-new instance has no ~/.bashrc at all. The console terminal is
        # `kubectl exec -- /bin/bash` — an interactive NON-login shell, which sources
        # only /etc/bash.bashrc + ~/.bashrc — so ~/.bashrc is THE per-tenant shell
        # customisation hook and it must exist. platform#407.
        #
        # Runs on EVERY pod start (not first-install-only): a file the tenant deleted
        # comes back, a file the tenant edited is left strictly alone.
        - name: seed-home
          image: {{ include "open-design.homeSeedImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              # NOTE: deliberately NO `set -e` (and an unconditional exit 0 below) —
              # a missing dotfile is cosmetic, but a failing initContainer would
              # CrashLoop the whole instance. Seeding is best-effort by design.
              SKEL={{ .Values.homeSeed.skelDir | quote }}
              HOME_DIR={{ .Values.persistence.home.mountPath | quote }}
              for f in{{ range .Values.homeSeed.files }} {{ . | quote }}{{ end }}; do
                src="$SKEL/$f"
                dst="$HOME_DIR/$f"
                if [ ! -f "$src" ]; then
                  echo "[seed-home] $src not in image — skip"
                elif [ -e "$dst" ]; then
                  echo "[seed-home] $dst exists — tenant-owned, skip (seed-if-absent)"
                elif cp "$src" "$dst" 2>/dev/null && chmod 644 "$dst" 2>/dev/null; then
                  echo "[seed-home] seeded $dst"
                else
                  echo "[seed-home] WARN: could not seed $dst (home volume not writable by uid $(id -u)?)"
                fi
              done
              exit 0
          securityContext:
            # uid 1001 (opendesign). /home/opendesign is drwxrwsr-x root:opendesign
            # and fsGroup=1001 makes the mounted volume group-writable, so the copies
            # land owned by the same user the daemon/ttyd shell runs as.
            runAsUser: {{ .Values.homeSeed.runAsUser }}
          # initContainers also need requests+limits (paas-ws-* ns ResourceQuota).
          resources:
            {{- toYaml .Values.homeSeed.resources | nindent 12 }}
          volumeMounts:
            - name: od-home
              mountPath: {{ .Values.persistence.home.mountPath }}
      {{- end }}
      {{- if $authInit }}
        # Render the nginx basic-auth htpasswd from the tenant admin_password. Kept
        # out of the ConfigMap (sensitive) — written to an emptyDir the nginx sidecar
        # reads. {PLAIN} scheme: admin_password is already in the Secret plaintext
        # (console gate / ttyd), so this leaks nothing new and avoids bcrypt-salt churn.
        - name: authproxy-init
          image: "{{ .Values.authProxy.image.repository }}:{{ .Values.authProxy.image.tag }}"
          imagePullPolicy: {{ .Values.authProxy.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -e
              # Strip CR/LF so a stray newline in admin_password can't inject a second
              # htpasswd line (nginx {PLAIN} reads to end-of-line).
              CLEAN_PW=$(printf '%s' "$ADMIN_PASSWORD" | tr -d '\r\n')
              printf '%s:{PLAIN}%s\n' "$BASIC_USER" "$CLEAN_PW" > /auth/.htpasswd
              chmod 644 /auth/.htpasswd
              echo "[authproxy-init] htpasswd written for user '$BASIC_USER'"
          env:
            # The username is read from the chart Secret (not written into the pod spec) so
            # a username change only touches the Secret: the pod template stays identical,
            # the operator's reset (`helm upgrade --atomic --timeout 15s`, i.e. --wait) returns
            # at once, and its rollout restart applies the new credential. A literal value here
            # changes the pod template, forcing helm to wait for a new pod (30-70 s) inside
            # 15 s — every username change rolled back and cost ~1 min of downtime.
            # An external auth.existingSecret may not carry admin_username, so that mode keeps
            # the literal value.
            - name: BASIC_USER
              {{- if .Values.auth.existingSecret }}
              value: {{ include "open-design.basicAuthUsername" . | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "open-design.secretName" . }}
                  key: admin_username
              {{- end }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "open-design.secretName" . }}
                  key: admin_password
          resources:
            {{- toYaml .Values.authProxy.initResources | nindent 12 }}
          volumeMounts:
            - name: authproxy-auth
              mountPath: /auth
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.image.enforceBindHost }}
          # Override CMD ONLY (keeps the image's tini ENTRYPOINT + zombie reaping) so
          # config.bindHost is authoritative: the upstream CMD's `--host 0.0.0.0`
          # (daemon CLI flag > OD_BIND_HOST env) would otherwise ignore bindHost and
          # listen on the pod IP, defeating the Option C loopback isolation.
          args:
            - node
            - apps/daemon/bin/od.mjs
            - --host
            - {{ .Values.config.bindHost | quote }}
            - --port
            - {{ $daemonPort | quote }}
            - --no-open
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $daemonPort }}
              protocol: TCP
          # Non-sensitive daemon env (OD_ALLOWED_ORIGINS / OD_PORT / OD_BIND_HOST).
          envFrom:
            - configMapRef:
                name: {{ include "open-design.configMapName" . }}
          env:
            # INTERNAL token (optional:true — with loopback bind the daemon exempts
            # nginx anyway; present for defense-in-depth / a 0.0.0.0 override).
            - name: OD_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "open-design.secretName" . }}
                  key: OD_API_TOKEN
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "open-design.secretName" . }}
                  key: ANTHROPIC_API_KEY
                  optional: true
            # Server-side OpenRouter key for the in-container OpenCode runtime
            # (BYOK keys typed in the web UI stay in the browser and never
            # reach here). Optional: absent key → env unset.
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "open-design.secretName" . }}
                  key: OPENROUTER_API_KEY
                  optional: true
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.authProxy.enabled }}
          # Daemon binds loopback → the kubelet cannot httpGet it. A startupProbe
          # guards the slow cold boot (heavy 2Gi image) so liveness can't kill it
          # mid-init; liveness then restarts only a HUNG daemon. Pod READINESS is
          # governed by the nginx sidecar (green once it can proxy /api/health).
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - curl -sf http://127.0.0.1:{{ $daemonPort }}/api/health || exit 1
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          {{- with .Values.livenessProbe }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - curl -sf http://127.0.0.1:{{ $daemonPort }}/api/health || exit 1
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- else }}
          # authProxy disabled → daemon bound 0.0.0.0, probed directly by the kubelet.
          {{- with .Values.readinessProbe }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: od-data
              mountPath: {{ .Values.persistence.data.mountPath }}
            - name: od-home
              mountPath: {{ .Values.persistence.home.mountPath }}
        {{- if .Values.authProxy.enabled }}
        - name: authproxy
          image: "{{ .Values.authProxy.image.repository }}:{{ .Values.authProxy.image.tag }}"
          imagePullPolicy: {{ .Values.authProxy.image.pullPolicy }}
          ports:
            - name: proxy
              containerPort: {{ .Values.authProxy.port }}
              protocol: TCP
          # READINESS proxies /api/health (basic-auth-exempt) to the daemon — the pod
          # is Ready only when nginx is up AND the daemon answers over loopback.
          {{- with .Values.readinessProbe }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: proxy
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # LIVENESS hits an nginx-LOCAL stub (return 200) — never the daemon — so a
          # daemon outage restarts the DAEMON (its own exec liveness), NOT this healthy
          # sidecar. Coupling nginx liveness to /api/health would restart the wrong
          # container and CrashLoop nginx during a daemon outage / slow cold boot.
          {{- with .Values.livenessProbe }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: proxy
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.authProxy.resources | nindent 12 }}
          volumeMounts:
            # subPath (not a bare conf.d dir mount) so the main nginx.conf — which
            # pins worker_processes (see auth-proxy-configmap) — lands at
            # /etc/nginx/nginx.conf while the server block stays in conf.d/.
            - name: authproxy-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: authproxy-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            {{- if .Values.authProxy.basicAuth.enabled }}
            - name: authproxy-auth
              mountPath: /etc/nginx/auth
              readOnly: true
            {{- end }}
        {{- end }}
      volumes:
        {{- if .Values.persistence.data.enabled }}
        - name: od-data
          persistentVolumeClaim:
            claimName: {{ include "open-design.dataPvcName" . }}
        {{- else }}
        # NON-persistent fallback — /app/.od is lost on pod restart.
        - name: od-data
          emptyDir: {}
        {{- end }}
        {{- if .Values.persistence.home.enabled }}
        - name: od-home
          persistentVolumeClaim:
            claimName: {{ include "open-design.homePvcName" . }}
        {{- else }}
        # NON-persistent fallback — the claude.ai login session is lost on restart.
        - name: od-home
          emptyDir: {}
        {{- end }}
        {{- if .Values.authProxy.enabled }}
        - name: authproxy-conf
          configMap:
            name: {{ include "open-design.authProxyConfigMapName" . }}
        {{- if .Values.authProxy.basicAuth.enabled }}
        - name: authproxy-auth
          emptyDir: {}
        {{- end }}
        {{- end }}
