# =============================================================================
# repo-guard.yml -- anti-pollution check
# =============================================================================
# This repository has previously been polluted by files belonging to sibling
# WOOWTECH projects (OpenClaw, Hermes). It also used to ship components that
# were deliberately deleted in the 2.0.0 rewrite: the ttyd/Flask console, the
# od-mcp sidecar, the from-source Dockerfile.open-design, and a Python
# renderer. This job blocks all of them from coming back by PATH, not by
# grepping file contents -- CHANGELOG.md and the READMEs must stay free to
# name the removed components when explaining why they were removed.

name: Repo Guard - Anti-Pollution Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-pollution:
    name: Check for cross-repo pollution and mirror completeness
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Scan for pollution and verify the mirror
        shell: bash
        run: |
          set -Eeuo pipefail
          found=0

          # Cross-repo pollution (sibling WOOWTECH projects).
          for dir in openclaw-k3s-paas openclaw-console setup-wizard hermes; do
            if [ -e "$dir" ]; then
              echo "POLLUTION: '$dir/' does not belong in Woow_k3s_opendesign"
              found=1
            fi
          done
          for file in Dockerfile.nerve Dockerfile.custom Dockerfile.hermes-agent; do
            if [ -e "$file" ]; then
              echo "POLLUTION: '$file' does not belong in Woow_k3s_opendesign"
              found=1
            fi
          done
          foreign=$(find . -maxdepth 3 \( -name '*openclaw*' -o -name '*hermes*' \) \
            -not -path './.git/*' -not -name '*.md' 2>/dev/null || true)
          if [ -n "$foreign" ]; then
            echo "POLLUTION: foreign files detected:"
            echo "$foreign" | sed 's/^/    /'
            found=1
          fi

          # 3.0.0: this repository became a mirror of the WOOW PaaS open-design
          # sources (see MIRROR.md). The PaaS version deliberately ships a
          # console (ttyd + dashboard) and a chart-managed Secret, so the 2.0.0
          # "removed components" list no longer applies; the single-instance
          # design it protected is preserved on legacy/k3s-single-instance.
          # The mirrored directories must exist, and nothing else may appear
          # at the top level next to them.
          for path in image/Dockerfile console/Dockerfile chart/Chart.yaml MIRROR.md; do
            if [ ! -e "$path" ]; then
              echo "MIRROR INCOMPLETE: '$path' is missing (run scripts/sync-from-gitea.sh)"
              found=1
            fi
          done

          if [ "$found" -eq 1 ]; then
            echo "Repo guard failed. Push blocked."
            exit 1
          fi

          echo "Repo guard: clean."
