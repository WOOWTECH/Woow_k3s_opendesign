# Build tools for the two omnigent dependencies that have no musllinux wheel
# (google-re2: setuptools; claude-agent-sdk: hatchling), hash-pinned so the sdist
# builds run with --no-build-isolation instead of downloading unpinned build deps.
# Removed from the venv again after the build unless omnigent-requirements.lock
# also lists them. Regenerate:
#   printf 'hatchling\nsetuptools\nwheel\n' > /tmp/build.in
#   uv pip compile /tmp/build.in --generate-hashes --python-version 3.12 \
#     --python-platform x86_64-unknown-linux-musl --no-header \
#     -c open-design/omnigent-requirements.lock \
#     -o open-design/omnigent-build-requirements.lock

